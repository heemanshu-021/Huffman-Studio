<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <circle cx="50" cy="50" r="45" stroke="#10b981" stroke-width="4" fill="#064e3b" fill-opacity="0.3"/>
  <!-- Root Node -->
  <circle cx="50" cy="25" r="8" fill="#10b981"/>
  <!-- Child Nodes -->
  <circle cx="30" cy="55" r="7" fill="#34d399"/>
  <circle cx="70" cy="55" r="7" fill="#34d399"/>
  <!-- Leaf Nodes -->
  <circle cx="20" cy="80" r="5" fill="#6ee7b7"/>
  <circle cx="40" cy="80" r="5" fill="#6ee7b7"/>
  <!-- Connecting Edges -->
  <line x1="50" y1="25" x2="30" y2="55" stroke="#10b981" stroke-width="2.5"/>
  <line x1="50" y1="25" x2="70" y2="55" stroke="#10b981" stroke-width="2.5"/>
  <line x1="30" y1="55" x2="20" y2="80" stroke="#34d399" stroke-width="2"/>
  <line x1="30" y1="55" x2="40" y2="80" stroke="#34d399" stroke-width="2"/>
</svg>
