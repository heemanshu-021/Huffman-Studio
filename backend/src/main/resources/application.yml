server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: huffman-studio-backend
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  name: Huffman Studio
  version: 1.0.0
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "http://127.0.0.1:5173"
      - "http://localhost:3000"

logging:
  level:
    root: INFO
    com.huffmanstudio: DEBUG
